name: Build DigitalLiquid APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DigitalLiquid
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Diagnose and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository root ==="
          pwd
          ls -la

          echo "=== Git-tracked manifests ==="
          git ls-files | grep -i 'AndroidManifest.xml' || true

          echo "=== All manifests ==="
          find . -type f -iname '*manifest*' \
            -not -path '*/.git/*' \
            -not -path '*/build/*' -print

          SETTINGS_FILE="$(find . -maxdepth 7 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Cannot find settings.gradle(.kts)"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Cannot find app/build.gradle(.kts)"
            find "$PROJECT_DIR" -maxdepth 5 -type f -print
            exit 1
          fi

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml is missing at the required path"
            echo "Expected: $MANIFEST"

            FOUND_MANIFEST="$(find "$PROJECT_DIR" -type f \
              -iname 'AndroidManifest.xml' \
              -not -path '*/build/*' \
              -print -quit || true)"

            if [ -n "$FOUND_MANIFEST" ]; then
              echo "Found another manifest: $FOUND_MANIFEST"
              echo "Checking whether it can be copied to the standard location..."

              mkdir -p "$PROJECT_DIR/app/src/main"
              cp "$FOUND_MANIFEST" "$MANIFEST"
              echo "Copied manifest to: $MANIFEST"
            else
              echo "::error::No AndroidManifest.xml exists in the project."
              echo "Add the correct manifest to app/src/main/ and commit it."
              exit 1
            fi
          fi

          echo "=== Manifest content ==="
          sed -n '1,220p' "$MANIFEST"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -size +0c -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLiquid-debug-apk
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
