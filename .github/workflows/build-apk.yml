name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix XML Resource Files
        run: |
          python3 - << 'EOF'
          import os, re

          # Quét tất cả các file XML trong thư mục res
          for root, dirs, files in os.walk('app/src/main/res'):
              for file in files:
                  if file.endswith('.xml'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      
                      # Xóa các thẻ <?xml> thừa hoặc sai vị trí
                      content = re.sub(r'<\?xml[^>]*\?>\s*', '', content, flags=re.IGNORECASE).lstrip()
                      
                      # Xóa triệt để chữ "attr/" nằm trong thuộc tính name
                      content = content.replace('android:attr/windowDimAmount', 'android:windowDimAmount')
                      content = content.replace('android:attr/colorBackground', 'android:colorBackground')
                      content = content.replace('android:attr/', 'android:')
                      content = content.replace('name="attr/', 'name="')
                      content = content.replace("name='attr/", "name='")
                      
                      # Ghi lại file với đúng 1 thẻ khai báo XML duy nhất ở dòng 1
                      fixed_content = '<?xml version="1.0" encoding="utf-8"?>\n' + content
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(fixed_content)
                      print(f"Đã sửa lỗi XML tại: {path}")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLiquid-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
