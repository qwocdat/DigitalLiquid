name: Build DigitalLiquid APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DigitalLiquid
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository directory:"
          pwd
          echo "Repository files:"
          ls -la

          SETTINGS_FILE="$(find . -maxdepth 6 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Cannot find settings.gradle or settings.gradle.kts"
            find . -maxdepth 5 -type f -print | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Gradle project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Cannot find app/build.gradle(.kts) in $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle --version
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Find and verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk -type f \
            -name '*debug*.apk' -size +0c -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "::error::Build finished but no non-empty debug APK was found"
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generated: $APK"
          ls -lh "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLiquid-debug-apk
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
