name: Fix & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-fix XML & Gradle errors
        run: |
          python3 - << 'EOF'
          import glob, re

          # 1. Sửa toàn bộ file XML trong dự án
          xml_files = glob.glob('app/src/main/res/**/*.xml', recursive=True)
          for path in xml_files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              # Xóa các thẻ <?xml> bị lặp hoặc sai dòng
              content = re.sub(r'<\?xml[^>]*\?>\s*', '', content, flags=re.IGNORECASE).lstrip()
              
              # Sửa lỗi: name="android:attr/..." thành name="android:..."
              content = re.sub(r'name="android:attr/([^"]+)"', r'name="android:\1"', content)
              
              # Đặt lại duy nhất 1 thẻ <?xml> chuẩn ở dòng 1
              fixed_content = '<?xml version="1.0" encoding="utf-8"?>\n' + content
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(fixed_content)

          # 2. Sửa file app/build.gradle.kts (Vô hiệu hóa Minify cho Debug)
          gradle_path = 'app/build.gradle.kts'
          try:
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g_content = f.read()
              def fix_debug_block(match):
                  block = match.group(0)
                  block = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', block)
                  block = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', block)
                  return block
              g_content = re.sub(r'debug\s*\{[^}]*\}', fix_debug_block, g_content, flags=re.DOTALL)
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g_content)
          except FileNotFoundError:
              pass
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLiquid-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
